<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b1a18"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meer"><meta name="description" content="Meer — тюнер, метроном и аккорды для гитариста"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" href="icons/icon-192.png"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Meer</title></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM15.5 9a4 4 0 0 1 0 6"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
<symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2c.5 3-1.4 4.8-3.2 6.9C7.2 10.8 6 12.5 6 15a6 6 0 0 0 12 0c0-2.2-1-3.8-2-5.2-.3 1.3-1 2.2-2 2.6.4-3.4-.2-7.6-2-10.4z"/></symbol>
</defs></svg>
<div class="app">
<header><img src="icons/meer-logo.png" alt=""><b>Meer</b><button class="streak" id="streak" aria-label="Streak"><svg class="f"><use href="#i-flame"/></svg><b id="sn">0</b></button><button class="ib" id="open-set" aria-label="Settings"><svg class="i"><use href="#i-set"/></svg></button></header>
<main id="tuner" class="screen on">
 <section class="card hero">
  <div class="row"><span class="tag" id="mode-tag"></span><span class="live"><i></i><span id="live"></span></span></div>
  <div class="note"><span id="note">—</span><sup id="oct"></sup></div>
  <div class="meta"><span id="hz">— Hz</span><span id="cents">0 ¢</span></div>
  <svg id="gauge" viewBox="0 0 320 180" role="img" aria-label="Tuning gauge">
   <path d="M20 160A140 140 0 0 1 300 160" class="g-arc"/><path id="zone" class="g-zone"/><g id="ticks"></g>
   <g id="needle"><path d="M160 160V50" class="n-core"/></g>
   <circle cx="160" cy="160" r="13" class="hub"/><circle cx="160" cy="160" r="4.5" class="hub-dot"/>
  </svg>
  <div class="status" id="status"><svg class="i"><use href="#i-check"/></svg><span></span></div>
  <div class="btns"><button class="pri" id="start"><svg class="i"><use href="#i-mic"/></svg><span></span></button></div>
 </section>
 <section class="card" id="str-card"><div class="sec-head"><b data-i="strings"></b><span id="str-count"></span></div><div class="strings" id="strings"></div></section>
</main>
<main id="metro" class="screen">
 <section class="card hero">
  <div class="ring" id="ring"><svg viewBox="0 0 260 260"><path d="M54 190A104 104 0 1 1 206 190" class="r-track"/><path d="M54 190A104 104 0 1 1 206 190" class="r-prog" id="r-prog" pathLength="100"/><circle id="r-knob" r="9" class="r-knob"/></svg>
   <div class="bpm"><strong id="bpm">120</strong><span id="tname"></span></div></div>
  <div class="tempo-ctl"><button class="rb" id="m10" aria-label="-1">−</button><input type="range" id="slider" min="30" max="250" aria-label="BPM"><button class="rb" id="p10" aria-label="+1">+</button></div>
  <div class="chips" id="meters"></div>
  <div class="btns"><button class="sec" id="tap" data-i="tap"></button><button class="sec" id="accent"></button></div>
  <button class="play" id="go" aria-label="Start"><svg class="i"><use href="#i-play" id="go-i"/></svg></button>
  <div class="dots" id="dots"></div>
 </section>
 <section class="card"><div class="presets" id="presets"></div><div class="vol"><svg class="i"><use href="#i-vol"/></svg><input type="range" id="vol" min="0" max="100" aria-label="Volume"><strong id="vol-v"></strong></div></section>
</main>
<main id="chords" class="screen">
 <section class="card hero">
  <div class="row"><span class="tag" data-i="chords"></span><span class="tag" id="c-notes"></span></div>
  <div class="cname" id="c-name">C</div>
  <button class="cdiag" id="c-diag" aria-label="Play"></button>
  <div class="btns"><button class="pri" id="c-play"><svg class="i"><use href="#i-vol"/></svg><span data-i="strum"></span></button></div>
 </section>
 <section class="card"><div class="chips cats" id="cats"></div><div class="pk grid" id="cgrid"></div><div id="cother" hidden><div class="sec-head"><b data-i="root"></b></div><div class="pk roots" id="roots"></div><div class="sec-head" style="margin-top:18px"><b data-i="type"></b></div><div class="pk types" id="ctypes"></div></div></section>
</main>
<aside id="sheet" aria-hidden="true"><div class="sheet-in"><div class="sheet-head"><button class="ib" id="close-set" aria-label="Back"><svg class="i"><use href="#i-back"/></svg></button><h2 data-i="settings"></h2></div><div class="acc" id="sets"></div><p class="ver">Meer v5.0</p></div></aside>
<div id="ibk" hidden></div>
<aside id="intro" aria-live="polite"><div class="mk" id="mk"></div><div class="bub"><p id="ibub"></p><div class="ibtns"><div class="idots" id="idots"></div><div class="ib2"><button class="lnk" id="iskip" data-i="i_skip"></button><button class="pri sm" id="inext"></button></div></div></div></aside>
<div id="toast" class="toast" role="status"></div>
<nav>
 <button class="on" data-s="tuner"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M8.5 3v6.2a3.5 3.5 0 0 0 7 0V3"/><path d="M12 12.7V21M9.8 21h4.4"/><path d="M4.6 7.4c-.9 1.3-.9 3.1 0 4.4M19.4 7.4c.9 1.3.9 3.1 0 4.4"/></svg></span><span data-i="tuner"></span></button>
 <button data-s="metro"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M9.2 3h5.6l3.2 15.4a2 2 0 0 1-2 2.6H8a2 2 0 0 1-2-2.6z"/><path d="M12 16.5l3.2-9"/><circle class="fl" cx="14.1" cy="10.2" r="1.3"/></svg></span><span data-i="metro"></span></button>
 <button data-s="chords"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M12 3.4C7.6 3.4 4.8 5 4.8 8.2c0 4.2 4.6 9.6 7.2 12.4 2.6-2.8 7.2-8.2 7.2-12.4C19.2 5 16.4 3.4 12 3.4z"/><circle class="fl" cx="9.2" cy="8.4" r="1.45"/><circle class="fl" cx="14.8" cy="8.4" r="1.45"/><circle class="fl" cx="12" cy="13" r="1.45"/></svg></span><span data-i="chords"></span></button>
</nav>
</div>
<script src="app.js"></script>
</body></html>
